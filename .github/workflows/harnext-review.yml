name: Harnext Review
# workflow_dispatch is required alongside the labeled trigger because
# GitHub suppresses `issues.labeled` / `pull_request.labeled` events when
# the label was added via GITHUB_TOKEN (infinite-loop guard). Chained
# handoffs from another workflow arrive as `gh workflow run` dispatches.
on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue or PR number to run this stage on'
        required: true
        type: string

jobs:
  claude:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'harnext:review'
    # agent stages run on the local runner: they need the Skill tool,
    # subagents and worktrees, which github-hosted runners cannot give them.
    # deterministic gates stay on github-hosted CI.
    # cap the stage: an uncapped job runs to github's 6h ceiling, and on a
    # self-hosted runner it holds a slot for all of it.
    timeout-minutes: 90
    # github-hosted while the repo is public. set the HARNEXT_RUNNER repo variable
    # to a JSON array of labels to put this back on the self-hosted runner.
    runs-on: ${{ fromJSON(vars.HARNEXT_RUNNER || '"ubuntu-latest"') }}

    # agent stage: protected-file edits are a hard failure here,
    # not the warning a human edit gets. see harness.config.json protected_files.
    env:
      HARNEXT_AGENT: '1'
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: write
    concurrency:
      group: harnext-review-review-${{ github.event.issue.number || github.event.pull_request.number || inputs.issue_number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # PAT_TOKEN so the agent's `git push` is authored by the user.
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Run Claude Code (reviewer)
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # OAuth via the Claude Code GitHub App — usage counts against the
          # user's Claude subscription (Pro/Max), not metered API billing.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # PAT_TOKEN so the agent's `git push` carries the `workflow` OAuth
          # scope - GITHUB_TOKEN cannot push changes under .github/workflows/**.
          github_token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          prompt: |
            You are the reviewer stage of a harnext pipeline. The PR number is ${{ github.event.issue.number || github.event.pull_request.number || inputs.issue_number }}.

            Check out the PR branch. Read the linked issue (`gh pr view <PR> --json body,closingIssuesReferences`), the plan comment, and the diff (`gh pr diff <PR>`).

            Review against, in this order:
              1. **Clean-room** — any transcribed predecessor source, templates, CSS, or design assets? Any wording that reads as copy-paste from the live system rather than description?
              2. **Personal data** — real names, e-mails, licence numbers, tenant names, device serials, or org access tokens in prose, examples, or fixtures?
              3. **Observed vs Inferred** — every predecessor claim marked; nothing silently promoted; sources of inferences plausible.
              4. **Domain vocabulary** — matches `CONTEXT.md` (UAS, occurrence, licence, certificate); no reintroduced synonyms.
              5. **Domain rules from `CLAUDE.md`** — nullable email, unassigned flights, failed-parse retention, duplicate sync, dual service intervals, stated maintenance readings, missing device-type semantics, detach ≠ delete, tenant scoping as security property. Any spec text that contradicts these?
              6. **Structural hygiene** — facts in one place with cross-refs, `docs/specs/00-index.md` updated when new files land, markdown/comment conventions followed, no changes to protected files.
              7. **Gates** — `bash scripts/check-conventions.sh` and `bash scripts/structural-tests.sh`, both clean. Report what the scripts say; do not hand-judge what they already decide.

            Then the two quality lenses. This stage runs on the self-hosted runner, so the `Skill` tool is available — use it, do not paraphrase these from memory:

              8. **Excess.** Invoke the `ponytail-review` skill on the diff. Findings are tagged `dupe:` / `delete:` / `yagni:` / `shrink:`. It never flags Observed/Inferred markings, the reasoning under a domain rule, or a documented open question — if it does, drop that finding.
              9. **Structure.** Invoke the `grain-review` skill on the same diff. Findings are tagged `misfiled:` / `unmarked:` / `vocab:` / `shape:` / `reinvent:` / `orphan:`. It must compare against sibling sections before judging; a first-of-its-kind section has no grain to go against.
              10. **Reconcile.** Where the two disagree, **consistency beats cuts** — if `ponytail-review` wants to delete something `grain-review` says matches its siblings, keep it and note `keep: matches <N> siblings`.

            Post one review with `gh pr review <PR> --comment`, and **begin the body with a verdict marker on its own line**:

                harnext-verdict: approve
                harnext-verdict: changes-requested

            The marker is the verdict. **Use `--comment`, not `--approve` or `--request-changes`** — GitHub refuses both from the account that opened the PR, and one account opens and reviews every PR in this repo, so an attempted `--request-changes` silently becomes a comment and the verdict is lost. That is #100, and the marker is what replaces the state the API cannot carry.

            **A review with no marker parks the PR on `harnext:needs-judgment`.** It is not treated as an approval. Requesting changes without the marker is the same as saying nothing.

            When the verdict is `changes-requested`, list each required change with the file, the line if possible, and the specific rule or lens tag it violates.
          # --allowedTools is REQUIRED. The action denies ALL tool calls by
          # default; any Bash call without this allowlist is silently
          # permission-denied.
          claude_args: '--model claude-opus-5 --effort high --max-turns 500 --dangerously-skip-permissions'
          # Needed when another workflow dispatches this one via
          # `gh workflow run` — the actor becomes github-actions[bot] and
          # the action rejects bot actors unless listed here.
          allowed_bots: 'github-actions'

      - name: Loop control (decide next step)
        if: success()
        env:
          # GITHUB_TOKEN deliberately, NOT the PAT: a label added by a PAT fires
          # the `labeled` event, which re-triggers the next stage on top of the
          # explicit `gh workflow run` below - firing it twice. GITHUB_TOKEN adds
          # labels without emitting the event, leaving the dispatch as the single
          # trigger. `actions: write` on this job is what lets it dispatch. See #21.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ github.event.pull_request.number || inputs.issue_number }}
        run: |
          set -euo pipefail

          labels=$(gh api "repos/${{ github.repository }}/issues/$NUM/labels" --jq '.[].name')
          iter=$(printf '%s\n' "$labels" | grep -oE '^harnext:review-iter-[0-9]+$' | head -n1 | grep -oE '[0-9]+$' || echo "")
          if [ -z "$iter" ]; then iter=1; fi

          # the verdict comes from a marker in the review body, not from the API's review
          # state. GitHub refuses CHANGES_REQUESTED from the account that opened the PR, and
          # one account opens and reviews every PR here - so a changes-requested review lands
          # as COMMENTED, and keying on the state meant the fixer never fired and the chain
          # advanced to verify, which posted a green pass over open findings. See #100.
          state=$(gh api "repos/${{ github.repository }}/pulls/$NUM/reviews" --jq '.[].state' | tail -n1)
          body=$(gh api "repos/${{ github.repository }}/pulls/$NUM/reviews" --jq 'last(.[]) | .body' 2>/dev/null || echo "")
          marker=$(printf '%s\n' "$body" | grep -oiE 'harnext-verdict:[[:space:]]*(approve|changes-requested)' | head -n1 | grep -oiE '(approve|changes-requested)' | tr '[:upper:]' '[:lower:]' || echo "")

          # the marker wins; the API state is the fallback for a review posted by an account
          # that *can* set it, which is any reviewer other than the PR author.
          case "$marker" in
            changes-requested) verdict=CHANGES_REQUESTED ;;
            approve)           verdict=APPROVED ;;
            *)                 verdict="$state" ;;
          esac

          echo "iter=$iter state=$state marker=${marker:-none} verdict=${verdict:-none}"

          if [ "$verdict" = "CHANGES_REQUESTED" ] && [ "$iter" -lt 3 ]; then
            # A. loop back into the fixer
            gh api -X DELETE "repos/${{ github.repository }}/issues/$NUM/labels/harnext:review-iter-$iter" || true
            next=$((iter + 1))
            gh api -X POST "repos/${{ github.repository }}/issues/$NUM/labels" -f labels[]="harnext:review-iter-$next"
            gh workflow run "harnext-review-fix.yml" --field issue_number="$NUM"
            exit 0
          fi

          if [ "$verdict" = "CHANGES_REQUESTED" ] && [ "$iter" -ge 3 ]; then
            # B. loop budget exhausted — park for human judgment
            gh api -X DELETE "repos/${{ github.repository }}/issues/$NUM/labels/harnext:review-iter-$iter" || true
            gh api -X DELETE "repos/${{ github.repository }}/issues/$NUM/labels/harnext:review" || true
            gh api -X POST "repos/${{ github.repository }}/issues/$NUM/labels" -f labels[]="harnext:needs-judgment"
            exit 0
          fi

          # C. an unreadable verdict parks rather than advancing. COMMENTED with no marker
          # used to fall through to verify, which is exactly how a green pass got posted over
          # open findings twice. Refusing to act on an input it cannot read is the same stance
          # this workflow already takes on a 422 from the reviews endpoint.
          if [ "$verdict" != "APPROVED" ]; then
            echo "no readable verdict (state=$state marker=${marker:-none}) - parking"
            gh api -X DELETE "repos/${{ github.repository }}/issues/$NUM/labels/harnext:review-iter-$iter" || true
            gh api -X DELETE "repos/${{ github.repository }}/issues/$NUM/labels/harnext:review" || true
            gh api -X POST "repos/${{ github.repository }}/issues/$NUM/labels" -f labels[]="harnext:needs-judgment"
            exit 0
          fi

          # D. approved — hand off to verify
          gh api -X DELETE "repos/${{ github.repository }}/issues/$NUM/labels/harnext:review-iter-$iter" || true
          gh api -X DELETE "repos/${{ github.repository }}/issues/$NUM/labels/harnext:review" || true
          gh api -X POST "repos/${{ github.repository }}/issues/$NUM/labels" -f labels[]="harnext:verify"
          gh workflow run "harnext-verify.yml" --field issue_number="$NUM" || true

      - name: Park on needs-judgment on failure
        if: failure()
        env:
          # GITHUB_TOKEN deliberately, NOT the PAT: a label added by a PAT fires
          # the `labeled` event, which re-triggers the next stage on top of the
          # explicit `gh workflow run` below - firing it twice. GITHUB_TOKEN adds
          # labels without emitting the event, leaving the dispatch as the single
          # trigger. `actions: write` on this job is what lets it dispatch. See #21.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ github.event.pull_request.number || inputs.issue_number }}
        run: |
          set -eu
          labels=$(gh api "repos/${{ github.repository }}/issues/$NUM/labels" --jq '.[].name' || echo "")
          iter=$(printf '%s\n' "$labels" | grep -oE '^harnext:review-iter-[0-9]+$' | head -n1 | grep -oE '[0-9]+$' || echo "")
          if [ -z "$iter" ]; then iter=1; fi
          gh api -X DELETE "repos/${{ github.repository }}/issues/$NUM/labels/harnext:review-iter-$iter" || true
          gh api -X DELETE "repos/${{ github.repository }}/issues/$NUM/labels/harnext:review" || true
          gh api -X POST "repos/${{ github.repository }}/issues/$NUM/labels" -f labels[]="harnext:needs-judgment"
