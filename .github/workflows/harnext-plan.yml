name: harnext plan
# workflow_dispatch is required alongside the labeled trigger because
# GitHub suppresses `issues.labeled` / `pull_request.labeled` events
# when the label was added via GITHUB_TOKEN (infinite-loop guard).
on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue or PR number to run this stage on'
        required: true
        type: string

jobs:
  claude:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'harnext:plan'
    # agent stages run on the local runner: they need the Skill tool,
    # subagents and worktrees, which github-hosted runners cannot give them.
    # deterministic gates stay on github-hosted CI.
    # cap the stage: an uncapped job runs to github's 6h ceiling, and on a
    # self-hosted runner it holds a slot for all of it.
    timeout-minutes: 45
    # github-hosted while the repo is public. set the HARNEXT_RUNNER repo variable
    # to a JSON array of labels to put this back on the self-hosted runner.
    runs-on: ${{ fromJSON(vars.HARNEXT_RUNNER || '"ubuntu-latest"') }}

    # agent stage: protected-file edits are a hard failure here,
    # not the warning a human edit gets. see harness.config.json protected_files.
    env:
      HARNEXT_AGENT: '1'
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: write
    concurrency:
      group: harnext-plan-${{ github.event.issue.number || github.event.pull_request.number || inputs.issue_number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # PAT_TOKEN so the agent's `git push` is authored by the user.
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Resolve issue number
        id: resolve
        env:
          NUM: ${{ github.event.issue.number || github.event.pull_request.number || inputs.issue_number }}
        run: echo "num=$NUM" >> "$GITHUB_OUTPUT"

      - name: Snapshot branch head
        id: pre
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # OAuth via the Claude Code GitHub App — usage counts against the
          # user's Claude subscription (Pro/Max), not metered API billing.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # PAT_TOKEN so the agent's `git push` carries the `workflow` OAuth
          # scope - GITHUB_TOKEN cannot push changes under .github/workflows/**.
          github_token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          prompt: |
            Read the issue with `gh issue view <num>`. Read `docs/specs/00-index.md` first, then any spec files the issue touches, plus `CONTEXT.md` and `CLAUDE.md`.

            First decide what kind of change this is. **Application code exists** — `src/`, `tests/`
            and `drizzle/` landed with #25 and #26 — so an issue may be a docs change, a code change,
            or both. Say which in the first line of the plan and shape the rest accordingly. Do not
            assume docs-only; this prompt asserted that until it was false for months of issues.

            Post exactly one comment via `gh issue comment <num> --body-file <path>` containing:
              - **Summary** — one paragraph, in `CONTEXT.md` vocabulary.
              - **Files to change** — each path with a one-line reason. For a spec file, say where it
                slots into `docs/specs/00-index.md`. For code, name the risk tier each path falls in
                per `harness.config.json` and flag any tier-3 touch explicitly — auth, tenant scoping,
                flight-log parsers and migrations are tier 3 and need a human in the loop.
              - **Approach** — how the change fits what is already there. For specs, the existing
                structure and the Observed/Inferred marking on every predecessor claim. For code, the
                established patterns: scoped reads through row-level security rather than a `WHERE`
                (`src/lib/tenant/`), forms declared once and asserted against `contracts/forms/`,
                every user-facing string through `src/lib/i18n`.
              - **Cross-references** — what else must change in the same PR so a fact still lives in
                one place: spec sections, `CONTEXT.md` entries, or the callers of a changed module.
              - **Risks** — clean-room (transcribing predecessor source/assets), personal-data leakage
                in examples or fixtures, silently promoting inferred → observed, breaking one of the
                domain rules in `CLAUDE.md`.
              - **Test plan** — which of the five layers in `docs/rebuild/00-operating-model.md` §5 the
                change needs, and the gates it must pass. Read the gates from `harness.config.json`
                `commands` rather than naming them from memory. A tier-3 path ships with a test that
                would fail if the property it claims were broken; say what that test asserts.

            Do not edit any files. Do not create a branch. One comment only.

            The issue or PR number for this run is: ${{ github.event.issue.number || github.event.pull_request.number || inputs.issue_number }}
          # --allowedTools is REQUIRED. The action denies ALL tool calls by
          # default; any Bash call without this allowlist is silently denied.
          claude_args: '--model claude-opus-5 --effort xhigh --max-turns 200 --allowedTools "Read,Glob,Grep,Bash"'
          # Needed when another workflow dispatches this one via
          # `gh workflow run` — the actor becomes github-actions[bot]
          # which the action rejects unless listed here.
          allowed_bots: 'github-actions'

      - name: Detect handoff to PR
        if: success()
        id: handoff
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          NUM: ${{ steps.resolve.outputs.num }}
          EVENT_NAME: ${{ github.event_name }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          echo "pr_number=" >> "$GITHUB_OUTPUT"

          # Only issues can hand off to a PR; PR-triggered runs stay on the PR.
          is_issue="false"
          if [ "$EVENT_NAME" = "issues" ]; then
            is_issue="true"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_NAME" = "pull_request" ]; then
            # dispatch may target either — probe the API.
            kind=$(gh api "repos/${{ github.repository }}/issues/$NUM" --jq '.pull_request != null' 2>/dev/null || echo "false")
            if [ "$kind" = "false" ]; then
              is_issue="true"
            fi
          fi

          if [ "$is_issue" != "true" ]; then
            echo "Stage ran on a PR; no handoff detection needed."
            exit 0
          fi

          pr_num=""

          # (a) execution_file — JSON array of turn objects (NOT JSONL).
          if [ -n "${EXECUTION_FILE:-}" ] && [ -f "$EXECUTION_FILE" ]; then
            text=$(jq -r '[.[] | select(.type == "assistant") | .message.content[] | select(.type == "text") | .text] | join("\n")' "$EXECUTION_FILE" || true)
            if [ -n "$text" ]; then
              pr_num=$(printf '%s' "$text" | grep -oE 'https://github\.com/${{ github.repository }}/pull/[0-9]+' | head -n1 | grep -oE '[0-9]+$' || true)
            fi
          fi

          # (b) issue timeline for cross-referenced PRs.
          #
          # only OPEN ones. the timeline accumulates every pull request that has
          # ever mentioned this issue, so an unfiltered `last` picks whichever
          # merged pr happened to reference it most recently - which is how a
          # plan run on #8 handed the implement stage to the long-merged #15 and
          # drove stages against it while #8 itself sat parked. a closed pr can
          # never be this run's handoff, so state is the filter that matters.
          if [ -z "$pr_num" ]; then
            pr_num=$(gh api "repos/${{ github.repository }}/issues/$NUM/timeline" \
              -H "Accept: application/vnd.github+json" \
              --jq '[.[] | select(.event == "cross-referenced") | .source.issue | select(.pull_request != null) | select(.state == "open") | .number] | last' 2>/dev/null || true)
            if [ "$pr_num" = "null" ]; then pr_num=""; fi
          fi

          if [ -n "$pr_num" ]; then
            echo "Detected handoff PR #$pr_num"
            echo "pr_number=$pr_num" >> "$GITHUB_OUTPUT"
          else
            echo "No PR handoff detected."
          fi

      - name: Transition labels on success
        if: success()
        env:
          # GITHUB_TOKEN deliberately, NOT the PAT: a label added by a PAT fires
          # the `labeled` event, which re-triggers the next stage on top of the
          # explicit `gh workflow run` below - firing it twice. GITHUB_TOKEN adds
          # labels without emitting the event, leaving the dispatch as the single
          # trigger. `actions: write` on this job is what lets it dispatch. See #21.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ steps.resolve.outputs.num }}
          PR_NUM: ${{ steps.handoff.outputs.pr_number }}
        run: |
          set -euo pipefail

          gh label create harnext:implement --color ededed --description "harnext: implement stage" 2>/dev/null || true
          gh label create harnext:awaiting-approval --color fbca04 --description "harnext: awaiting human approval" 2>/dev/null || true

          # Always remove the stage label from the originating issue/PR.
          gh api -X DELETE "repos/${{ github.repository }}/issues/$NUM/labels/harnext:plan" 2>/dev/null || true

          if [ -n "$PR_NUM" ]; then
            # Handoff: issue goes to awaiting-approval; PR picks up the next stage label.
            gh api -X POST "repos/${{ github.repository }}/issues/$NUM/labels" \
              -f "labels[]=harnext:awaiting-approval"
            gh api -X POST "repos/${{ github.repository }}/issues/$PR_NUM/labels" \
              -f "labels[]=harnext:implement"
            # Dispatch the next workflow explicitly — labels added via
            # GITHUB_TOKEN do NOT fire `labeled` events.
            gh workflow run harnext-implement.yml \
              --field issue_number=$PR_NUM || true
          else
            # No handoff — chain directly on the same number.
            gh api -X POST "repos/${{ github.repository }}/issues/$NUM/labels" \
              -f "labels[]=harnext:implement"
            gh workflow run harnext-implement.yml \
              --field issue_number=$NUM || true
          fi

      - name: Park on needs-judgment on failure
        if: failure()
        env:
          # GITHUB_TOKEN deliberately, NOT the PAT: a label added by a PAT fires
          # the `labeled` event, which re-triggers the next stage on top of the
          # explicit `gh workflow run` below - firing it twice. GITHUB_TOKEN adds
          # labels without emitting the event, leaving the dispatch as the single
          # trigger. `actions: write` on this job is what lets it dispatch. See #21.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ steps.resolve.outputs.num }}
        run: |
          set -euo pipefail
          gh label create harnext:needs-judgment --color b60205 --description "harnext: needs human judgment" 2>/dev/null || true
          gh api -X DELETE "repos/${{ github.repository }}/issues/$NUM/labels/harnext:plan" 2>/dev/null || true
          gh api -X POST "repos/${{ github.repository }}/issues/$NUM/labels" \
            -f "labels[]=harnext:needs-judgment"
