name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Conventions — the mechanically-decidable half of review.
  #
  # While this repo is documentation-only every change is Tier 1 and `lint` is the
  # single required check. Stack-specific jobs (type-check, test, build) land here
  # alongside the application code, per harness.config.json.
  # ============================================================================
  lint:
    name: Conventions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # check-conventions.sh diff-scopes against the merge-base with main
          fetch-depth: 0

      - name: Check conventions
        run: bash scripts/check-conventions.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # the shell gate runs first and stays first: it checks things no
      # TypeScript toolchain knows about - personal data, AI attribution,
      # confidence marking - and must not be displaced by eslint arriving.
      - name: Lint sources
        run: npm run lint

  # ============================================================================
  # Structural invariants. Whole-tree by nature and cheap, so unlike the sweep
  # it runs on pull requests too: it asks whether the repo still hangs together
  # (every spec doc reachable and contiguously numbered, load-bearing files
  # parseable, check scripts executable), and a PR is exactly where a break in
  # that should surface. Architectural boundary enforcement joins it when
  # application code lands.
  # ============================================================================
  # the job id is the name harness.config.json already lists under tier1
  # requiredChecks, so it stays spelled exactly that way.
  structural-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Structural tests
        run: bash scripts/structural-tests.sh

  # ============================================================================
  # Application checks. tier2 and tier3 in harness.config.json have required
  # `type-check`, `test` and `build` since the tiers were written, and nothing
  # produced them - so a TypeScript change could go green having never been
  # compiled, tested or built. They arrive now rather than earlier because
  # pointing a gate at `npm run build` in a repo with no package.json fails for
  # reasons unrelated to the change under review, and a gate that always fails
  # gets ignored.
  #
  # job ids are spelled exactly as harness.config.json requires them.
  # ============================================================================
  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

  # ============================================================================
  # Full-tree sweep. The conventions check is diff-scoped on PRs so that
  # pre-existing violations never block unrelated work; this catches anything
  # that slipped in before the guard existed.
  # ============================================================================
  sweep:
    name: Full-tree sweep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check conventions (all files)
        run: bash scripts/check-conventions.sh --all
